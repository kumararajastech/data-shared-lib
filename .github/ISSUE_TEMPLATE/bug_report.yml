name: Bug Report
description: File a bug report for DataSharedLib
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve DataSharedLib!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce / Code Sample
      description: Include C# code snippet or SQL query demonstrating the issue.
    validations:
      required: true
