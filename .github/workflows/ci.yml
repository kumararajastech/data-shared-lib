name: CI Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true

    - name: Restore dependencies
      run: dotnet restore DataSharedLib.csproj

    - name: Build Library
      run: dotnet build DataSharedLib.csproj --configuration Release --no-restore

    - name: Pack NuGet Package
      run: dotnet pack DataSharedLib.csproj --configuration Release --no-build --output ./nupkg
